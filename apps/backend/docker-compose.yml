services:
  redis:
    image: redis:alpine
    container_name: redis_cascadheure
    command: redis-server --protected-mode no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cascadheure-net

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis_commander_cascadheure
    environment:
      # Correction ici : on pointe vers le nom du service 'redis'
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cascadheure-net

  db:
    image: postgres:15-alpine
    container_name: db_cascadheure
    environment:
      - POSTGRES_USER=admin_cascadheure
      - POSTGRES_PASSWORD=1234567890
      - POSTGRES_DB=cascadheure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cascadheure-net

networks:
  cascadheure-net:
    driver: bridge

volumes:
  postgres_data: